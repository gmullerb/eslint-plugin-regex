image: node:latest

stages:
  - one
  - assemble

only-one:
  stage: one
  script:
    - npm install
    - npm install -g jko
    - jko lint
    - jko test
  coverage: '/Branches.*?(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
    - build/coverage/report/lcov-report/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/report/cobertura-coverage.xml

pages:
  stage: assemble
  dependencies:
    - only-one
  script:
    - mkdir -p to_public
    - touch to_public/index.html
    - mv build/coverage/report/lcov-report/ to_public/coverage
    - mv to_public public
  artifacts:
    paths:
      - public
  only:
    - master
